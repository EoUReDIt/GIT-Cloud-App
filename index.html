<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repo Mover</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#dde1e7;--text:#1c2128;--mute:#667085;--accent:#2f6fed;--accent-bg:#e6eeff;--ok:#1a7f4b;--warn:#b25e09;--bad:#c62828;--row:#eef1f5}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--panel:#171c23;--line:#2a313b;--text:#e6e9ee;--mute:#8a94a3;--accent:#6c9bff;--accent-bg:#1c2a4a;--ok:#4cc38a;--warn:#f0a050;--bad:#ff7b72;--row:#202733}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{border-color:transparent;background:transparent;padding:2px 6px}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;margin:0;flex:1}
#app{flex:1;display:flex;min-height:0}
#app.login{display:block}
.pane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.pane+.pane{border-left:2px solid var(--line)}
.bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.bar .repoPick{flex:1;min-width:140px}
.hint{color:var(--mute);font-size:12px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.tree{flex:1;overflow:auto;padding:8px 10px 40px;outline:none}
.row{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;cursor:default;border:1px solid transparent;user-select:none}
.row:hover{background:var(--row)}
.row.sel{background:var(--accent-bg)}
.row.over{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 2px var(--accent) inset}
.row.root{font-weight:600;margin-bottom:2px}
.caret{width:14px;text-align:center;color:var(--mute);font-size:10px;cursor:pointer;transition:transform .1s}
.node.open>.row>.caret{transform:rotate(90deg)}
.node>.kids{display:none}.node.open>.kids{display:block}
.name{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dirrow .name{font-weight:500}
.tag{font-size:11px;padding:0 6px;border-radius:9px;border:1px solid currentColor}
.tag.moved{color:var(--warn)}.tag.new{color:var(--ok)}.tag.mod{color:var(--warn);border:0;padding:0}
.acts{margin-left:auto;display:none;gap:2px}
.row:hover .acts{display:flex}
input.ren{padding:1px 6px;min-width:160px}
.commitBar{border-top:1px solid var(--line);background:var(--panel);padding:8px 12px;display:none;flex-direction:column;gap:8px}
.commitBar.show{display:flex}
.changes{max-height:140px;overflow:auto;font:12px ui-monospace,Consolas,monospace;color:var(--mute);display:none}
.changes.show{display:block}
.changes b{color:var(--text);font-weight:400}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.line input{flex:1;min-width:120px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw;z-index:9}
#toast.show{opacity:1}#toast.err{background:var(--bad)}
.center{margin:12vh auto;max-width:520px;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.center h2{margin-top:0}.center input{width:100%;margin:8px 0}
.center code{background:var(--row);padding:1px 5px;border-radius:4px}
.muted{color:var(--mute)}
@media(max-width:800px){#app{flex-direction:column}.pane+.pane{border-left:0;border-top:2px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>📂 Repo Mover</h1>
  <label class="muted" id="modeWrap" style="display:none">Drag between panes:
    <select id="mode"><option value="copy">Copy</option><option value="move">Move</option></select>
    <span>(hold Shift to do the opposite)</span></label>
  <button id="commitAll" class="primary" style="display:none">Commit both</button>
  <span id="who" class="muted"></span>
  <button id="signout" style="display:none">Sign out</button>
</header>
<div id="app"></div>
<datalist id="repoList"></datalist>
<div id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dirname = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
const basename = p => p.slice(p.lastIndexOf('/') + 1);
const join = (d, n) => d ? d + '/' + n : n;
const under = (p, d) => p === d || p.startsWith(d + '/');
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch {} },
                del(k){ try { localStorage.removeItem(k); } catch {} } };

const G = { token: store.get('rm_token') || '', user: null, repos: [], panes: [], drag: null };

/* ---------- GitHub API ---------- */
async function gh(path, opts = {}) {
  const r = await fetch('https://api.github.com' + path, { ...opts, headers: {
    Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + G.token,
    'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (!r.ok) {
    let m = ''; try { m = (await r.json()).message; } catch {}
    throw new Error(r.status + ' ' + (m || r.statusText));
  }
  return r.status === 204 ? null : r.json();
}
const post = (p, b, method = 'POST') => gh(p, { method, body: JSON.stringify(b) });

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', err ? 5000 : 2600);
}
const anyPending = () => G.panes.some(p => p.pending());
const mode = () => $('#mode').value;

/* ---------- boot / sign-in ---------- */
async function boot() {
  if (!G.token) return showLogin();
  try {
    G.user = await gh('/user');
    $('#who').textContent = G.user.login; $('#signout').style.display = '';
    $('#modeWrap').style.display = ''; $('#mode').value = store.get('rm_mode') || 'copy';
    $('#app').className = ''; $('#app').innerHTML = '';
    G.panes = [new Pane(0), new Pane(1)];
    await loadRepos();
    for (const p of G.panes) {
      const r = G.repos.find(x => x.full_name === store.get('rm_repo' + p.i));
      if (r) await p.selectRepo(r);
    }
  } catch (e) { store.del('rm_token'); G.token = ''; showLogin(e.message); }
}
function showLogin(err) {
  $('#who').textContent = ''; $('#signout').style.display = 'none'; $('#modeWrap').style.display = 'none';
  $('#app').className = 'login';
  $('#app').innerHTML = `<div class="center"><h2>Connect to GitHub</h2>
    <p>Create a personal access token and paste it here. It stays in this browser only (localStorage) and is sent only to api.github.com.</p>
    <ul class="muted"><li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Fine-grained token</a>: pick your repos, grant <code>Contents: Read and write</code>.</li>
    <li>Or a <a href="https://github.com/settings/tokens/new?scopes=repo" target="_blank" rel="noopener">classic token</a> with the <code>repo</code> scope.</li></ul>
    <input id="tok" type="password" placeholder="ghp_… or github_pat_…" autocomplete="off">
    ${err ? `<div style="color:var(--bad)">${esc(err)}</div>` : ''}
    <button class="primary" id="go">Connect</button></div>`;
  const go = () => { G.token = $('#tok').value.trim(); if (!G.token) return; store.set('rm_token', G.token); boot(); };
  $('#go').onclick = go; $('#tok').onkeydown = e => e.key === 'Enter' && go();
}
$('#signout').onclick = () => { if (anyPending() && !confirm('Discard pending changes and sign out?')) return;
  store.del('rm_token'); store.del('rm_repo0'); store.del('rm_repo1'); location.reload(); };
$('#mode').onchange = e => store.set('rm_mode', e.target.value);
$('#commitAll').onclick = async () => {
  // panes that only add files go first, so a failed commit never leaves files deleted but not copied
  const order = G.panes.filter(p => p.pending()).sort((a, b) => a.diff().deleted.length - b.diff().deleted.length);
  for (const p of order) if (!(await p.commit())) break;
};
function refreshGlobal() {
  const n = G.panes.filter(p => p.pending()).length;
  $('#commitAll').style.display = n > 1 ? '' : 'none';
}
addEventListener('beforeunload', e => { if (anyPending()) { e.preventDefault(); e.returnValue = ''; } });
addEventListener('dragend', () => { G.drag = null; });

async function loadRepos() {
  G.repos = [];
  for (let p = 1; p <= 5; p++) {
    const page = await gh(`/user/repos?per_page=100&page=${p}&sort=pushed&affiliation=owner`);
    G.repos.push(...page); if (page.length < 100) break;
  }
  $('#repoList').innerHTML = G.repos.map(r => `<option value="${esc(r.full_name)}"></option>`).join('');
}

/* ---------- one repo pane ---------- */
class Pane {
  constructor(i) {
    this.i = i; this.repo = null; this.branch = ''; this.gen = 0;
    this.headCommit = ''; this.baseTree = ''; this.truncated = false;
    this.orig = []; this.origMap = new Map(); this.files = []; this.virt = new Set();
    this.expanded = new Set(); this.selected = new Set(); this.undoStack = []; this.newId = 0;
    this.IDX = new Map(); this.CHG = new Map(); this.CHGDIRS = new Set();
    const el = this.el = document.createElement('section'); el.className = 'pane';
    el.innerHTML = `
      <div class="bar">
        <input class="repoPick" list="repoList" placeholder="Choose repository (type to search)…" autocomplete="off">
        <select class="branch" style="display:none"></select>
        <a class="ghlink muted" target="_blank" rel="noopener" style="display:none">GitHub ↗</a>
      </div>
      <div class="bar tools" style="display:none">
        <button class="newDir" title="Create a folder, then drag files into it">＋ New folder</button>
        <button class="expandAll">Expand all</button><button class="collapseAll">Collapse all</button>
        <button class="undo" disabled>↶ Undo</button>
        <span class="muted trunc" style="margin-left:auto"></span>
      </div>
      <div class="hint">Drag files or folders onto a folder to move them · drag onto the other pane to copy/move between repos · ＋ New folder makes a destination · Ctrl/⌘-click multi-selects · nothing changes on GitHub until you commit.</div>
      <div class="tree" tabindex="0"></div>
      <div class="commitBar">
        <div class="changes"></div>
        <div class="line"><span class="summary"></span><button class="ghost toggleChanges">details</button>
          <input class="msg" placeholder="Commit message"><button class="discard">Discard</button><button class="primary commit">Commit</button></div>
      </div>`;
    $('#app').append(el);
    this.q = s => el.querySelector(s);
    const pick = this.q('.repoPick');
    pick.onfocus = () => { pick.dataset.prev = pick.value; pick.value = ''; };
    pick.onblur = () => { if (!pick.value) pick.value = pick.dataset.prev || ''; };
    pick.onchange = () => { const r = G.repos.find(x => x.full_name === pick.value.trim()); if (r) { pick.blur(); this.selectRepo(r); } };
    this.q('.newDir').onclick = () => this.newFolder();
    this.q('.expandAll').onclick = () => { this.dirs().forEach(d => this.expanded.add(d)); this.render(); };
    this.q('.collapseAll').onclick = () => { this.expanded.clear(); this.render(); };
    this.q('.undo').onclick = () => this.undo();
    this.q('.discard').onclick = () => { if (confirm('Discard all staged changes in this pane?')) this.resetWork(); };
    this.q('.commit').onclick = () => this.commit();
    this.q('.toggleChanges').onclick = () => this.q('.changes').classList.toggle('show');
    this.q('.branch').onchange = async e => {
      if (this.pending() && !confirm('Discard staged changes and switch branch?')) { e.target.value = this.branch; return; }
      await this.loadTree(e.target.value);
    };
    this.wireTree();
  }

  pending() { if (!this.repo) return 0; const d = this.diff(); return d.moved.length + d.added.length + d.deleted.length + d.emptyDirs.length; }

  async selectRepo(r) {
    if (this.pending() && !confirm('Discard staged changes and switch repository?')) return;
    this.repo = r; store.set('rm_repo' + this.i, r.full_name); this.expanded.clear(); this.selected.clear();
    this.q('.repoPick').value = r.full_name;
    const gl = this.q('.ghlink'); gl.href = r.html_url; gl.style.display = '';
    this.q('.tools').style.display = '';
    this.files = []; this.orig = []; this.virt = new Set(); this.render();
    const gen = ++this.gen;
    try {
      const br = (await gh(`/repos/${r.full_name}/branches?per_page=100`)).map(b => b.name);
      if (gen !== this.gen) return;
      const sel = this.q('.branch'); sel.style.display = '';
      sel.innerHTML = br.map(b => `<option>${esc(b)}</option>`).join('');
      await this.loadTree(br.includes(r.default_branch) ? r.default_branch : br[0]);
    } catch (e) { this.q('.tree').innerHTML = ''; toast(e.message, true); }
  }

  /* ----- tree loading ----- */
  async loadTree(branch) {
    const gen = ++this.gen;
    this.branch = branch; this.q('.branch').value = branch; this.truncated = false;
    this.q('.tree').innerHTML = '<div class="muted" style="padding:12px">Loading…</div>';
    const R = `/repos/${this.repo.full_name}`;
    let orig = [], head = '', base = '';
    try {
      const ref = await gh(`${R}/git/ref/heads/${branch}`);
      head = ref.object.sha;
      const commit = await gh(`${R}/git/commits/${head}`);
      base = commit.tree.sha;
      const t = await gh(`${R}/git/trees/${base}?recursive=1`);
      if (gen !== this.gen) return;
      this.truncated = !!t.truncated;
      orig = t.tree.filter(e => e.type !== 'tree').map(e => ({ id: e.path, path: e.path, sha: e.sha, mode: e.mode, type: e.type }));
    } catch (e) {
      if (gen !== this.gen) return;
      head = '';
      toast(e.message.startsWith('409') ? 'This repository is empty — make a first commit on GitHub first.' : e.message, true);
    }
    this.orig = orig; this.headCommit = head; this.baseTree = base;
    this.q('.trunc').textContent = this.truncated ? '⚠ tree truncated by GitHub (very large repo)' : '';
    this.resetWork();
  }
  resetWork() {
    this.origMap = new Map(this.orig.map(o => [o.id, o]));
    this.files = this.orig.map(o => ({ ...o })); this.virt = new Set(); this.undoStack = []; this.selected.clear();
    this.render();
  }

  /* ----- derived structure ----- */
  dirs() {
    const d = new Set();
    const addAnc = p => { for (let x = dirname(p); x; x = dirname(x)) d.add(x); };
    this.files.forEach(f => addAnc(f.path));
    this.virt.forEach(v => { d.add(v); addAnc(v); });
    return d;
  }
  rebuild() {
    const D = this.dirs(), IDX = this.IDX = new Map(); IDX.set('', { dirs: [], files: [] });
    D.forEach(d => IDX.set(d, { dirs: [], files: [] }));
    D.forEach(d => IDX.get(dirname(d)).dirs.push(d));
    this.files.forEach(f => IDX.get(dirname(f.path)).files.push(f));
    const byName = (a, b) => basename(a.path ?? a).localeCompare(basename(b.path ?? b), undefined, { numeric: true, sensitivity: 'base' });
    IDX.forEach(v => { v.dirs.sort(byName); v.files.sort(byName); });
    const CHG = this.CHG = new Map(), CD = this.CHGDIRS = new Set();
    for (const f of this.files) {
      const o = this.origMap.get(f.id);
      const st = f.isNew ? 'new' : (o && o.path !== f.path ? 'moved' : '');
      if (st) {
        CHG.set(f.id, st);
        for (let x = dirname(f.path); x; x = dirname(x)) CD.add(x);
        if (o) for (let x = dirname(o.path); x; x = dirname(x)) CD.add(x);
      }
    }
  }

  /* ----- rendering ----- */
  dirRow(path, depth) {
    const sel = this.selected.has(path) ? ' sel' : '';
    const mod = this.CHGDIRS.has(path) ? '<span class="tag mod" title="contains changes">●</span>' : '';
    return `<div class="row dirrow${sel}" draggable="true" data-type="dir" data-path="${esc(path)}" style="padding-left:${8 + depth * 18}px"><span class="caret" data-act="toggle">▶</span><span>📁</span><span class="name">${esc(basename(path))}</span>${mod}<span class="acts"><button class="ghost" data-act="rename" title="Rename (F2)">✎</button><button class="ghost" data-act="del" title="Delete (Del)">🗑</button></span></div>`;
  }
  fileRow(f, depth) {
    const sel = this.selected.has(f.path) ? ' sel' : '';
    const st = this.CHG.get(f.id), o = this.origMap.get(f.id);
    const title = o ? `from ${o.path}` : (f.srcRepo && f.srcRepo !== this.repo.full_name ? `copied from ${f.srcRepo}` : '');
    const tag = st ? `<span class="tag ${st}" ${title ? `title="${esc(title)}"` : ''}>${st}</span>` : '';
    return `<div class="row${sel}" draggable="true" data-type="file" data-path="${esc(f.path)}" style="padding-left:${8 + depth * 18}px"><span class="caret"></span><span>📄</span><span class="name">${esc(basename(f.path))}</span>${tag}<span class="acts"><button class="ghost" data-act="rename" title="Rename (F2)">✎</button><button class="ghost" data-act="del" title="Delete (Del)">🗑</button></span></div>`;
  }
  renderKids(dir, depth) {
    const c = this.IDX.get(dir); if (!c) return '';
    return c.dirs.map(d => {
      const open = this.expanded.has(d);
      return `<div class="node${open ? ' open' : ''}" data-p="${esc(d)}">${this.dirRow(d, depth)}<div class="kids">${open ? this.renderKids(d, depth + 1) : ''}</div></div>`;
    }).join('') + c.files.map(f => this.fileRow(f, depth)).join('');
  }
  render() {
    const T = this.q('.tree');
    if (!this.repo) { T.innerHTML = '<div class="muted" style="padding:12px">Pick a repository above.</div>'; this.renderCommitBar(); return; }
    this.rebuild();
    const empty = !this.files.length && !this.virt.size;
    T.innerHTML = `<div class="row root" data-type="dir" data-path="">📦 ${esc(this.repo.name)} <span class="muted" style="font-weight:400">/ (root)</span></div>` +
      (empty ? '<div class="muted" style="padding:12px">Empty. Drop files here or create a folder.</div>' : this.renderKids('', 0));
    this.q('.undo').disabled = !this.undoStack.length;
    this.renderCommitBar();
  }
  rowFor(path) {
    for (const r of this.q('.tree').querySelectorAll('.row')) if (r.dataset.path === path) return r;
    return null;
  }
  paintSel() { this.q('.tree').querySelectorAll('.row').forEach(r => r.classList.toggle('sel', this.selected.has(r.dataset.path))); }
  expandNode(path, on = true) {
    if (on) this.expanded.add(path); else this.expanded.delete(path);
    const row = this.rowFor(path); if (!row) return;
    const node = row.parentElement; node.classList.toggle('open', on);
    const kids = node.querySelector(':scope > .kids');
    if (on && !kids.firstChild) kids.innerHTML = this.renderKids(path, path.split('/').length);
  }

  /* ----- mutations (all staged, undoable) ----- */
  snapshot() {
    this.undoStack.push({ files: this.files.map(f => ({ ...f })), virt: [...this.virt], expanded: [...this.expanded] });
    if (this.undoStack.length > 100) this.undoStack.shift();
  }
  undo() {
    const s = this.undoStack.pop(); if (!s) return;
    this.files = s.files; this.virt = new Set(s.virt); this.expanded = new Set(s.expanded); this.selected.clear(); this.render();
  }
  remap(s, np) {
    const re = p => under(p, s) ? np + p.slice(s.length) : p;
    this.files.forEach(f => f.path = re(f.path));
    this.virt = new Set([...this.virt].map(re));
    this.expanded = new Set([...this.expanded].map(re));
  }
  applyMoves(plan) {
    const D = this.dirs(), files = new Set(this.files.map(f => f.path)), seen = new Set();
    for (const [, np] of plan) {
      if (files.has(np) || D.has(np) || seen.has(np)) { toast(`"${basename(np)}" already exists there`, true); return false; }
      for (let x = dirname(np); x; x = dirname(x)) if (files.has(x)) { toast(`"${x}" is a file`, true); return false; }
      seen.add(np);
    }
    this.snapshot();
    const moved = [];
    for (const [s, np] of plan) { this.remap(s, np); moved.push(np); }
    this.selected = new Set(moved);
    this.render();
    return true;
  }
  moveItems(srcs, dest) {
    const D = this.dirs();
    srcs = [...new Set(srcs)];
    srcs = srcs.filter(s => !srcs.some(o => o !== s && under(s, o)));
    const plan = [];
    for (const s of srcs) {
      if (D.has(s) && under(dest, s)) return toast("A folder can't go inside itself", true);
      const np = join(dest, basename(s)); if (np !== s) plan.push([s, np]);
    }
    if (!plan.length) return;
    if (this.applyMoves(plan)) { if (dest) this.expanded.add(dest); this.render(); }
  }
  renameItem(path, name) {
    if (!name || /[\/\\]/.test(name) || name === '.' || name === '..') { toast('Invalid name', true); return this.render(); }
    if (!this.applyMoves([[path, join(dirname(path), name)]])) this.render();
  }
  deleteItems(paths) {
    paths = [...paths]; if (!paths.length) return;
    this.snapshot();
    this.files = this.files.filter(f => !paths.some(p => under(f.path, p)));
    this.virt = new Set([...this.virt].filter(v => !paths.some(p => under(v, p))));
    this.selected.clear(); this.render();
  }
  newFolder() {
    let base = '';
    const sel = [...this.selected][0];
    if (sel) base = this.dirs().has(sel) ? sel : dirname(sel);
    const taken = p => this.dirs().has(p) || this.files.some(f => f.path === p);
    let name = 'New folder', n = 2;
    while (taken(join(base, name))) name = `New folder ${n++}`;
    const p = join(base, name);
    this.snapshot(); this.virt.add(p);
    for (let x = p; x; x = dirname(x)) this.expanded.add(dirname(x));
    this.selected = new Set([p]); this.render();
    this.startRename(p);   // type the real name straight away
  }

  /* ----- cross-repo copy / move ----- */
  // Files and empty folders under the dragged paths, keyed by their path relative to the drop target.
  collect(paths) {
    paths = [...new Set(paths)];
    paths = paths.filter(s => !paths.some(o => o !== s && under(s, o)));
    const items = [], vdirs = [];
    for (const s of paths) {
      const rel = p => basename(s) + p.slice(s.length);
      for (const f of this.files) if (under(f.path, s)) items.push({ rel: rel(f.path), f });
      for (const v of this.virt) if (under(v, s)) vdirs.push({ rel: rel(v), v });
    }
    return { items, vdirs };
  }
  receive(dest, src, paths, move) {
    const { items, vdirs } = src.collect(paths);
    const D = this.dirs(), have = new Set(this.files.map(f => f.path));
    const blocked = np => { for (let x = dirname(np); x; x = dirname(x)) if (have.has(x)) return true; return false; };
    const ok = [], seen = new Set(); let skipped = 0, unsupported = 0;
    for (const it of items) {
      const np = join(dest, it.rel);
      if (it.f.type === 'commit') { unsupported++; continue; }
      if (have.has(np) || D.has(np) || seen.has(np) || blocked(np)) { skipped++; continue; }
      seen.add(np); ok.push({ np, f: it.f });
    }
    const okDirs = vdirs.map(d => join(dest, d.rel)).filter(p => !have.has(p) && !blocked(p));
    if (!ok.length && !okDirs.length) {
      return toast(skipped ? 'Nothing copied — everything already exists in the destination' : 'Nothing to copy', true);
    }
    this.snapshot();
    for (const { np, f } of ok) {
      const c = { id: 'new:' + (++this.newId), path: np, isNew: true, mode: f.mode || '100644', type: 'blob' };
      if (f.b64 !== undefined) c.b64 = f.b64;
      else { c.srcRepo = f.srcRepo || src.repo.full_name; c.srcSha = f.srcSha || f.sha; }
      this.files.push(c);
    }
    okDirs.forEach(p => this.virt.add(p));
    if (dest) this.expanded.add(dest);
    this.selected = new Set(paths.map(p => join(dest, basename(p))));
    this.render();
    if (move) {   // remove from the source only what was actually copied
      const gone = new Set(ok.map(o => o.f.id));
      const goneDirs = new Set(vdirs.filter(d => okDirs.includes(join(dest, d.rel))).map(d => d.v));
      src.snapshot();
      src.files = src.files.filter(f => !gone.has(f.id));
      src.virt = new Set([...src.virt].filter(v => !goneDirs.has(v)));
      src.selected.clear(); src.render();
    }
    const n = ok.length + okDirs.length;
    toast(`${move ? 'Moved' : 'Copied'} ${n} item${n > 1 ? 's' : ''} to ${this.repo.full_name}` +
      (skipped ? ` · ${skipped} skipped (already exist)` : '') + (unsupported ? ` · ${unsupported} submodule(s) skipped` : '') +
      ' — commit to apply');
  }

  /* ----- commit ----- */
  diff() {
    const cur = new Map(this.files.map(f => [f.id, f]));
    const moved = [], deleted = [], added = this.files.filter(f => f.isNew);
    for (const o of this.orig) {
      const c = cur.get(o.id);
      if (!c) deleted.push(o); else if (c.path !== o.path) moved.push([o, c]);
    }
    const emptyDirs = [...this.virt].filter(v => !this.files.some(f => under(f.path, v)));
    return { moved, deleted, added, emptyDirs };
  }
  autoMessage(d) {
    const srcs = [...new Set(d.added.map(f => f.srcRepo).filter(r => r && r !== this.repo.full_name))];
    if (d.added.length && srcs.length === 1 && d.added.every(f => f.srcRepo === srcs[0]) && !d.moved.length && !d.deleted.length)
      return `Copy ${d.added.length} file${d.added.length > 1 ? 's' : ''} from ${srcs[0]}`;
    if (d.moved.length && !d.added.length && !d.deleted.length && !d.emptyDirs.length) {
      if (d.moved.length === 1) return `Move ${d.moved[0][0].path} to ${d.moved[0][1].path}`;
      return `Reorganize: move/rename ${d.moved.length} files`;
    }
    if (d.deleted.length && !d.moved.length && !d.added.length && !d.emptyDirs.length)
      return `Remove ${d.deleted.length} file${d.deleted.length > 1 ? 's' : ''}`;
    return 'Reorganize files';
  }
  renderCommitBar() {
    const bar = this.q('.commitBar');
    if (!this.repo) { bar.classList.remove('show'); refreshGlobal(); return; }
    const d = this.diff(), n = d.moved.length + d.added.length + d.deleted.length + d.emptyDirs.length;
    bar.classList.toggle('show', n > 0);
    const bits = [];
    if (d.moved.length) bits.push(`${d.moved.length} moved/renamed`);
    if (d.added.length) bits.push(`${d.added.length} added`);
    if (d.deleted.length) bits.push(`${d.deleted.length} deleted`);
    if (d.emptyDirs.length) bits.push(`${d.emptyDirs.length} new folder${d.emptyDirs.length > 1 ? 's' : ''}`);
    this.q('.summary').textContent = bits.join(' · ');
    const L = [];
    d.moved.forEach(([o, c]) => L.push(`<div>↪ ${esc(o.path)} → <b>${esc(c.path)}</b></div>`));
    d.added.forEach(f => L.push(`<div>＋ <b>${esc(f.path)}</b>${f.srcRepo && f.srcRepo !== this.repo.full_name ? ` <span>(from ${esc(f.srcRepo)})</span>` : ''}</div>`));
    d.deleted.forEach(o => L.push(`<div>✕ ${esc(o.path)}</div>`));
    d.emptyDirs.forEach(p => L.push(`<div>＋ <b>${esc(p)}/.gitkeep</b></div>`));
    this.q('.changes').innerHTML = L.slice(0, 300).join('') + (L.length > 300 ? `<div>…and ${L.length - 300} more</div>` : '');
    this.q('.msg').placeholder = this.autoMessage(d);
    refreshGlobal();
  }
  // Returns true on success so "Commit both" can stop at the first failure.
  async commit() {
    const d = this.diff(); if (!this.pending()) return true;
    const message = this.q('.msg').value.trim() || this.autoMessage(d);
    const btn = this.q('.commit'); btn.disabled = true; btn.textContent = 'Committing…';
    const R = `/repos/${this.repo.full_name}`, name = this.repo.full_name;
    try {
      const map = new Map();
      d.deleted.forEach(o => map.set(o.path, { path: o.path, mode: o.mode, type: o.type, sha: null }));
      d.moved.forEach(([o]) => map.set(o.path, { path: o.path, mode: o.mode, type: o.type, sha: null }));
      d.moved.forEach(([o, c]) => map.set(c.path, { path: c.path, mode: o.mode, type: o.type, sha: o.sha }));
      // blobs: uploaded bytes are posted; copies from another repo are fetched there and re-posted here
      const cache = new Map();
      const blobFor = f => {
        if (f.b64 === undefined && f.srcRepo === name) return Promise.resolve(f.srcSha);
        const key = f.b64 !== undefined ? null : f.srcRepo + '@' + f.srcSha;
        if (key && cache.has(key)) return cache.get(key);
        const p = (async () => {
          let b64 = f.b64;
          if (b64 === undefined) b64 = (await gh(`/repos/${f.srcRepo}/git/blobs/${f.srcSha}`)).content.replace(/\s/g, '');
          return (await post(`${R}/git/blobs`, { content: b64, encoding: 'base64' })).sha;
        })();
        if (key) cache.set(key, p);
        return p;
      };
      let done = 0, next = 0;
      const worker = async () => {
        while (next < d.added.length) {
          const f = d.added[next++];
          const sha = await blobFor(f);
          map.set(f.path, { path: f.path, mode: f.mode || '100644', type: 'blob', sha });
          btn.textContent = `Uploading ${++done}/${d.added.length}…`;
        }
      };
      await Promise.all([worker(), worker(), worker(), worker()]);
      if (d.emptyDirs.length) {
        let keep;
        try { keep = (await post(`${R}/git/blobs`, { content: '', encoding: 'utf-8' })).sha; }
        catch { keep = (await post(`${R}/git/blobs`, { content: '\n', encoding: 'utf-8' })).sha; }
        d.emptyDirs.forEach(p => map.set(p + '/.gitkeep', { path: p + '/.gitkeep', mode: '100644', type: 'blob', sha: keep }));
      }
      const tree = await post(`${R}/git/trees`, { base_tree: this.baseTree, tree: [...map.values()] });
      const c = await post(`${R}/git/commits`, { message, tree: tree.sha, parents: [this.headCommit] });
      await post(`${R}/git/refs/heads/${this.branch}`, { sha: c.sha }, 'PATCH');
      this.q('.msg').value = '';
      toast(`Committed to ${name} ✔`);
      await this.loadTree(this.branch);
      // keep the other pane fresh when it shows the same repo/branch
      for (const o of G.panes) if (o !== this && o.repo && o.repo.full_name === name && o.branch === this.branch && !o.pending()) o.loadTree(o.branch);
      return true;
    } catch (e) {
      toast('Commit failed: ' + e.message + (e.message.startsWith('422') ? ' (branch changed on GitHub? reload and redo)' : ''), true);
      return false;
    } finally { btn.disabled = false; btn.textContent = 'Commit'; }
  }

  /* ----- tree interaction ----- */
  startRename(path) {
    const row = this.rowFor(path); if (!row) return;
    const nm = row.querySelector('.name'); if (!nm) return;
    row.draggable = false;
    const inp = document.createElement('input'); inp.className = 'ren'; inp.value = basename(path);
    nm.replaceWith(inp); inp.focus();
    const dot = row.dataset.type === 'file' ? inp.value.lastIndexOf('.') : -1;
    inp.setSelectionRange(0, dot > 0 ? dot : inp.value.length);
    let done = false;
    const fin = ok => {
      if (done) return; done = true;
      const v = inp.value.trim();
      if (ok && v !== basename(path)) this.renameItem(path, v); else this.render();
    };
    inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') fin(true); if (e.key === 'Escape') fin(false); };
    inp.onblur = () => fin(true);
    inp.onclick = e => e.stopPropagation();
  }

  wireTree() {
    const T = this.q('.tree');
    let overDest = null, hoverTimer = null;
    const clearOver = () => { T.querySelectorAll('.row.over').forEach(r => r.classList.remove('over')); overDest = null; clearTimeout(hoverTimer); };
    const destOf = e => {
      const row = e.target.closest('.row');
      if (!row) return '';
      return row.dataset.type === 'dir' ? row.dataset.path : dirname(row.dataset.path);
    };
    const crossMove = e => (mode() === 'move') !== e.shiftKey;

    T.addEventListener('click', e => {
      const row = e.target.closest('.row'); if (!row) { this.selected.clear(); this.paintSel(); return; }
      const path = row.dataset.path, act = e.target.closest('[data-act]')?.dataset.act;
      if (act === 'rename') return this.startRename(path);
      if (act === 'del') return this.deleteItems([path]);
      if (!path) return;
      if (e.ctrlKey || e.metaKey) { this.selected.has(path) ? this.selected.delete(path) : this.selected.add(path); }
      else this.selected = new Set([path]);
      this.paintSel();
      if (row.dataset.type === 'dir' && !(e.ctrlKey || e.metaKey) && e.detail < 2) this.expandNode(path, !this.expanded.has(path));
    });
    T.addEventListener('dblclick', e => {
      const row = e.target.closest('.row'); if (!row || !row.dataset.path) return;
      if (e.target.classList.contains('name')) this.startRename(row.dataset.path);
    });
    T.addEventListener('keydown', e => {
      const first = [...this.selected][0];
      if (e.key === 'F2' && first) { e.preventDefault(); this.startRename(first); }
      else if (e.key === 'Delete' && this.selected.size) this.deleteItems(this.selected);
      else if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); this.undo(); }
      else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') this.commit();
    });

    T.addEventListener('dragstart', e => {
      const row = e.target.closest('.row'); if (!row || !row.dataset.path) return e.preventDefault();
      const p = row.dataset.path;
      if (!this.selected.has(p)) { this.selected = new Set([p]); this.paintSel(); }
      G.drag = { pane: this, paths: [...this.selected] };
      e.dataTransfer.setData('application/x-paths', JSON.stringify(G.drag.paths));
      e.dataTransfer.setData('text/plain', G.drag.paths.join('\n'));
      e.dataTransfer.effectAllowed = 'copyMove';
    });
    T.addEventListener('dragover', e => {
      if (!this.repo) return;
      e.preventDefault();
      const dest = destOf(e), d = G.drag;
      e.dataTransfer.dropEffect = !d ? 'copy' : d.pane === this ? 'move' : (crossMove(e) ? 'move' : 'copy');
      if (dest === overDest) return;
      clearOver(); overDest = dest;
      const r = this.rowFor(dest); if (r) r.classList.add('over');
      if (dest && !this.expanded.has(dest)) hoverTimer = setTimeout(() => this.expandNode(dest, true), 700);
    });
    T.addEventListener('dragleave', e => { if (!T.contains(e.relatedTarget)) clearOver(); });
    T.addEventListener('drop', e => {
      e.preventDefault();
      if (!this.repo) return;
      const dest = destOf(e); clearOver();
      const d = G.drag; G.drag = null;
      if (d && d.pane === this) this.moveItems(d.paths, dest);
      else if (d) this.receive(dest, d.pane, d.paths, crossMove(e));
    });
  }
}

boot();
</script>
</body>
</html>
